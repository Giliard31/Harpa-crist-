<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arpa Cristã</title>
    <style>
        :root { 
            --bg-color: #ffffff; 
            --text-color: #333333; 
            --card-bg: #f4f4f4; 
            --tamanho-fonte: 1.2rem; 
        }
        body.tema-branco { --bg-color: #ffffff; --text-color: #333333; --card-bg: #f4f4f4; }
        body.tema-preto { --bg-color: #121212; --text-color: #e0e0e0; --card-bg: #1e1e1e; }
        body.tema-rosa { --bg-color: #ffe6eb; --text-color: #591f2e; --card-bg: #ffccd5; }
        body.tema-azul { --bg-color: #0056b3; --text-color: #ffffff; --card-bg: #004085; }
        body.tema-azul-bebe { --bg-color: #e3f2fd; --text-color: #0d47a1; --card-bg: #bbdefb; }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            transition: background 0.4s ease, color 0.4s ease; 
        }

        header { 
            display: flex; 
            align-items: center; 
            padding: 12px 16px; 
            background: var(--card-bg); 
            justify-content: space-between; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .menu-btn, .sair-btn { 
            font-size: 1.4rem; 
            cursor: pointer; 
            border: none; 
            background: none; 
            color: var(--text-color); 
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .menu-btn:active, .sair-btn:active {
            background: rgba(0,0,0,0.1);
        }

        .search-box { 
            display: flex; 
            gap: 8px; 
            flex: 1; 
            margin: 0 12px; 
        }

        input { 
            flex: 1; 
            padding: 8px 12px; 
            border-radius: 20px; 
            border: 1px solid #ccc; 
            font-size: 1rem;
            outline: none;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .btn-busca { 
            padding: 8px 14px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-busca:active { opacity: 0.8; }

        /* Overlay e Menu Lateral Suave */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 99;
        }

        .overlay.ativo {
            opacity: 1;
            visibility: visible;
        }

        .sidebar { 
            position: fixed; 
            top: 0; 
            left: -280px; 
            width: 280px; 
            height: 100%; 
            background: var(--card-bg); 
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 100; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.15); 
            padding-top: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .sidebar.ativo {
            left: 0;
        }

        .sidebar-header {
            padding: 0 20px 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }

        .sidebar-item {
            margin-bottom: 20px;
        }

        .sidebar-item select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: var(--bg-color);
            color: var(--text-color);
            margin-top: 6px;
        }

        .fonte-controles {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .fonte-controles button {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            font-weight: bold;
        }

        /* Container Principal */
        .container { 
            padding: 20px; 
            max-width: 600px;
            margin: 0 auto;
        }

        .hino-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-fav {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
        }

        .hino-content { 
            white-space: pre-wrap; 
            font-size: var(--tamanho-fonte); 
            line-height: 1.7; 
        }

        .lista-fav {
            list-style: none;
            padding: 0;
            margin: 6px 0 0 0;
        }

        .lista-fav li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
        }
    </style>
</head>
<body class="tema-branco">

    <header>
        <button class="menu-btn" onclick="alternarMenu(true)">☰</button>
        <div class="search-box">
            <input type="number" id="numHino" placeholder="Nº do hino (1 a 640)..." inputmode="numeric">
            <button class="btn-busca" onclick="buscarHino()">🔍</button>
        </div>
        <button class="sair-btn" onclick="sairApp()" title="Sair do aplicativo">✕</button>
    </header>

    <!-- Fundo escuro suave que fecha o menu ao clicar fora -->
    <div id="overlay" class="overlay" onclick="alternarMenu(false)"></div>

    <!-- Menu Lateral Deslizante -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">Configurações</div>
        <div class="sidebar-content">
            <div class="sidebar-item">
                <label><strong>Tamanho da Letra:</strong></label>
                <div class="fonte-controles">
                    <button onclick="mudarFonte(-1)">A-</button>
                    <button onclick="mudarFonte(1)">A+</button>
                </div>
            </div>

            <div class="sidebar-item">
                <label><strong>Tema / Cor de Fundo:</strong></label>
                <select id="seletorTema" onchange="mudarTema(this.value)">
                    <option value="tema-branco">Branco</option>
                    <option value="tema-preto">Preto</option>
                    <option value="tema-rosa">Rosa</option>
                    <option value="tema-azul">Azul</option>
                    <option value="tema-azul-bebe">Azul Bebê</option>
                </select>
            </div>

            <div class="sidebar-item">
                <label><strong>⭐ Favoritos:</strong></label>
                <ul id="listaFavoritos" class="lista-fav">
                    <li style="color: #777; font-size: 0.9rem;">Nenhum favoritado ainda</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Conteúdo do Hino -->
    <div class="container">
        <div class="hino-header">
            <h2 id="tituloHino" style="margin: 0;">Arpa Cristã</h2>
            <button id="btnFavorito" class="btn-fav" onclick="toggleFavorito()" style="display: none;">🤍</button>
        </div>
        <div id="letraHino" class="hino-content">Carregando os hinos da Arpa Cristã...</div>
    </div>

    <script>
        let tamAtual = 1.2;
        let hinoAtualId = null;
        let listaHinos = [];
        let favoritos = JSON.parse(localStorage.getItem('hinosFavoritos')) || {};

        // Carrega o JSON local do repositório GitHub
        async function carregarHinos() {
            try {
                const resposta = await fetch('harpa_crista_640_hinos.json');
                if (!resposta.ok) throw new Error('Erro ao carregar');
                
                listaHinos = await resposta.json();
                document.getElementById('letraHino').innerText = "Digite o número do hino acima (ex: 15) e clique na lupa para começar.";
            } catch (erro) {
                document.getElementById('letraHino').innerText = "Erro ao carregar o arquivo JSON. Certifique-se de que o arquivo 'harpa_crista_640_hinos.json' está na mesma pasta do index.html no GitHub.";
                console.error(erro);
            }
        }

        // Controle suave do Menu Lateral e Overlay
        function alternarMenu(abrir) {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("overlay");
            if (abrir) {
                sidebar.classList.add("ativo");
                overlay.classList.add("ativo");
            } else {
                sidebar.classList.remove("ativo");
                overlay.classList.remove("ativo");
            }
        }

        // Mudar Tema
        function mudarTema(tema) {
            document.body.className = tema;
            localStorage.setItem('tema', tema);
        }

        // Mudar Fonte
        function mudarFonte(direcao) {
            tamAtual += direcao * 0.1;
            if (tamAtual < 0.9) tamAtual = 0.9;
            if (tamAtual > 2.2) tamAtual = 2.2;
            document.documentElement.style.setProperty('--tamanho-fonte', tamAtual + 'rem');
            localStorage.setItem('tamanhoFonte', tamAtual);
        }

        // Buscar Hino no JSON local
        function buscarHino() {
            const numInput = document.getElementById('numHino').value.trim();
            const num = parseInt(numInput, 10);

            if (isNaN(num) || listaHinos.length === 0) {
                alert("Por favor, digite um número válido de hino.");
                return;
            }

            let hinoEncontrado = null;
            
            // Tenta encontrar pela posição exata ou pelas propriedades id/numero do JSON
            if (listaHinos[num - 1]) {
                hinoEncontrado = listaHinos[num - 1];
            } else {
                hinoEncontrado = listaHinos.find(h => h.id == num || h.numero == num || h.number == num);
            }

            if (hinoEncontrado) {
                hinoAtualId = num;
                
                const titulo = hinoEncontrado.title || hinoEncontrado.titulo || `Hino ${num}`;
                const letra = hinoEncontrado.lyrics || hinoEncontrado.letra || hinoEncontrado.text || "Letra não encontrada.";

                document.getElementById('tituloHino').innerText = `${num} - ${titulo}`;
                document.getElementById('letraHino').innerText = letra;
                document.getElementById('btnFavorito').style.display = "block";
                
                atualizarIconeFavorito();
            } else {
                document.getElementById('tituloHino').innerText = "Hino não encontrado";
                document.getElementById('letraHino').innerText = `O hino número ${num} não foi localizado no arquivo JSON.`;
                document.getElementById('btnFavorito').style.display = "none";
            }
        }

        // Favoritos
        function toggleFavorito() {
            if (!hinoAtualId) return;
            const titulo = document.getElementById('tituloHino').innerText;

            if (favoritos[hinoAtualId]) {
                delete favoritos[hinoAtualId];
            } else {
                favoritos[hinoAtualId] = titulo;
            }

            localStorage.setItem('hinosFavoritos', JSON.stringify(favoritos));
            atualizarListaFavoritos();
            atualizarIconeFavorito();
        }

        function atualizarIconeFavorito() {
            const btnFav = document.getElementById('btnFavorito');
            if (favoritos[hinoAtualId]) {
                btnFav.innerText = "❤️";
            } else {
                btnFav.innerText = "🤍";
            }
        }

        function atualizarListaFavoritos() {
            const lista = document.getElementById('listaFavoritos');
            lista.innerHTML = "";
            const ids = Object.keys(favoritos);

            if (ids.length === 0) {
                lista.innerHTML = '<li style="color: #777; font-size: 0.9rem;">Nenhum favoritado ainda</li>';
                return;
            }

            ids.forEach(id => {
                const li = document.createElement('li');
                li.innerText = favoritos[id];
                li.onclick = () => {
                    document.getElementById('numHino').value = id;
                    buscarHino();
                    alternarMenu(false);
                };
                lista.appendChild(li);
            });
        }

        // Tela Sempre Acesa
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }

        // Sair instantaneamente
        function sairApp() {
            window.close();
            setTimeout(() => {
                window.location.href = "about:blank";
            }, 100);
        }

        // Inicialização
        window.onload = () => {
            const temaSalvo = localStorage.getItem('tema');
            if (temaSalvo) {
                document.body.className = temaSalvo;
                document.getElementById('seletorTema').value = temaSalvo;
            }

            const fonteSalva = localStorage.getItem('tamanhoFonte');
            if (fonteSalva) {
                tamAtual = parseFloat(fonteSalva);
                document.documentElement.style.setProperty('--tamanho-fonte', tamAtual + 'rem');
            }

            atualizarListaFavoritos();
            carregarHinos();
        };
    </script>
</body>
</html>
